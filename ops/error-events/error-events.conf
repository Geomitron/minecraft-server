# Drop-in for minecraft.service: records how the server process ended, for the error watcher.
# Installed at /etc/systemd/system/minecraft.service.d/error-events.conf. "-" keeps a failed record from failing the
# stop; "+" runs it as root outside the server's lockdown, so it can write the exits file.
[Service]
ExecStopPost=-+/bin/sh /home/minecraft-error-events/record-exit.sh %n
